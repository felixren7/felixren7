name: Profile achievements card

on:
  schedule:
    - cron: '11 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-achievements
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/achievements_card.py
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/achievements-card.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update achievements card'
            git push
          fi
