name: Singapore weather and daily thought

on:
  schedule:
    - cron: '7 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-daily-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update card
        run: python scripts/daily_card.py
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/daily-card.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update weather and daily thought'
            git push
          fi
