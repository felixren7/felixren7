name: Profile metrics

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Activity metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: felixren7
          filename: metrics.svg
          template: classic
          config_timezone: Asia/Singapore
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories_affiliations: owner, collaborator
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_notable: yes
          plugin_notable_from: all
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Achievements
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: felixren7
          filename: achievements.svg
          template: classic
          config_timezone: Asia/Singapore
          base: ''
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: felixren7
          filename: languages.svg
          template: classic
          config_timezone: Asia/Singapore
          base: ''
          repositories_affiliations: owner, collaborator
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_categories: programming, markup
          plugin_languages_recent_categories: programming, markup
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 200
          plugin_languages_skipped: felixren7/freeCodeCamp, felixren7/CISE_Repos
          commits_authoring: felixren7
