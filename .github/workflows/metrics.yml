name: Profile metrics

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Activity metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: felixren7
          filename: metrics.svg
          template: classic
          config_timezone: Asia/Singapore
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories_affiliations: owner, collaborator
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_notable: yes
          plugin_notable_from: all
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # The achievements plugin is not used: its GraphQL query requests
      # user.projects, which GitHub removed with the Projects (classic)
      # sunset, so the plugin always renders "Unexpected error". Upstream is
      # unmaintained (last commit 2023-12). The card is generated by
      # scripts/achievements_card.py instead, via the achievements workflow.

      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: felixren7
          filename: languages.svg
          template: classic
          config_timezone: Asia/Singapore
          base: ''
          repositories_affiliations: owner, collaborator
          plugin_languages: yes
          plugin_languages_indepth: yes
          # "recently-used" is not requested: its RecentAnalyzer reads
          # payload.commits from PushEvents, which the Events API no longer
          # returns, so it throws on `payload.commits` being undefined.
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_categories: programming, markup
          plugin_languages_skipped: felixren7/freeCodeCamp, felixren7/CISE_Repos
          commits_authoring: felixren7
